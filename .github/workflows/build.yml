name: Shabro Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: نصب جاوا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: آماده‌سازی اندروید
        uses: android-actions/setup-android@v3

      - name: نصب ابزارهای اندروید
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ساخت برنامه
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "فایل ZIP پروژه پیدا نشد"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          cd project
          gradle assembleDebug

      - name: ذخیره فایل نصب
        uses: actions/upload-artifact@v4
        with:
          name: Shabro-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
