name: Build Shabro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: آماده‌سازی جاوا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: آماده‌سازی Android SDK
        uses: android-actions/setup-android@v3

      - name: ساخت APK
        run: |
          unzip -q پروژه_اندروید_شبرو.zip -d project
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: ذخیره فایل نصب
        uses: actions/upload-artifact@v4
        with:
          name: Shabro-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
