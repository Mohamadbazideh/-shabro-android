name: Shabro Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: آماده‌سازی جاوا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: آماده‌سازی Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: ساخت APK
        run: |
          unzip -q پروژه_اندروید_شبرو.zip
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: ذخیره فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: Shabro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
